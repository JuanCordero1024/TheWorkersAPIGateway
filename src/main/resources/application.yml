server:
  port: 8080

jwt:
  secret-key: ${SPRING_JWT_KEY}
  expiration-ms: ${SPRING_JWT_EXPIRATION}

backend-ecc-public-key: ${SPRING_ECC_PUBLIC_KEY}
backend-ecc-private-key: ${SPRING_ECC_PRIVATE_KEY}

spring:
  application:
    name: the-workers-gateway

  cloud:
    gateway:
      routes:
        - id: user_verify_credentials
          uri: http://${SPRING_USER_SERVICE:localhost:8081}
          predicates:
            - Path=/api/user/verify-credentials

        - id: user_set_ecc_token
          uri: http://${SPRING_USER_SERVICE:localhost:8081}
          predicates:
            - Path=/api/user/setEccToken/**
          filters:
            - JWTAuthentication

        - id: auth_public_login
          uri: http://${SPRING_AUTH_SERVICE:localhost:8083}
          predicates:
            - Path=/api/auth/login

        - id: role_user_management
          uri: http://${SPRING_ROLE_SERVICE:localhost:8082}
          predicates:
            - Path=/api/role/**
          filters:
            - JWTAuthentication


        # RUTA DE USUARIOS (REGISTRO DE CLAVE)
        - id: user_management
          uri: http://${SPRING_USER_SERVICE:localhost:8081}
          predicates:
            - Path=/api/user/**
          filters:
           - JWTAuthentication

        - id: file_services
          uri: http://${SPRING_FILES_SERVICE:localhost:8084}
          predicates:
            - Path=/api/file/**
          filters:
            - JWTAuthentication