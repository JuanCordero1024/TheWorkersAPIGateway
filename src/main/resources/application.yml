server:
  port: 8080

spring:
  application:
    name: the-workers-gateway

  cloud:
    gateway:
      routes:
        # ----------------------------------------------------
        # RUTA A: tráfico real hacia el microservicio de roles
        # ----------------------------------------------------
        - id: role_user_management
          uri: http://localhost:8082
          predicates:
            - Path=/api/role/**

        - id: user_management
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**

