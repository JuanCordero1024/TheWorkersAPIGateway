server:
  port: 8080

jwt:
  secret-key: ${SPRING_JWT_KEY}
  expiration-ms: ${SPRING_JWT_EXPIRATION}

backend-ecc-public-key: ${SPRING_ECC_PUBLIC_KEY}
backend-ecc-private-key: ${SPRING_ECC_PRIVATE_KEY}

spring:
  application:
    name: the-workers-gateway

  cloud:
    gateway:
      routes:
        - id: user_verify_credentials
          uri: http://${SPRING_USER_SERVICE}
          predicates:
            - Path=/api/user/verify-credentials
          filters:
            - name: LocalRateLimit
              args:
                maxRequests: 5
                durationInMs: 60000

        - id: auth_public_login
          uri: http://${SPRING_AUTH_SERVICE}
          predicates:
            - Path=/api/auth/login
          filters:
            - name: LocalRateLimit
              args:
                maxRequests: 5
                durationInMs: 60000

        - id: role_user_management
          uri: http://${SPRING_ROLE_SERVICE}
          predicates:
            - Path=/api/role/**
          filters:
            - JWTAuthentication

        # RUTA DE USUARIOS (REGISTRO DE CLAVE)
        - id: user_management
          uri: http://${SPRING_USER_SERVICE}
          predicates:
            - Path=/api/user/**
          filters:
            - JWTAuthentication
            - name: LocalRateLimit

        - id: file_services
          uri: http://${SPRING_FILES_SERVICE}
          predicates:
            - Path=/api/file/**
          filters:
            - JWTAuthentication